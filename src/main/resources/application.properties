spring.application.name=hospitalManagement

# Datasource - set DB_PASSWORD as an environment variable, never hardcode credentials
spring.datasource.url=jdbc:postgresql://localhost:5432/hospitalDB
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Use 'validate' or 'update' in staging/production - 'create' drops and recreates schema on startup
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
